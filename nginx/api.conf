# Substitua "api.seudominio.com.br" pelo subdomínio real
# Para dev, use "api-dev.seudominio.com.br"

server {
    listen 80;
    server_name api.lead2pack.com.br;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name api.lead2pack.com.br;

    ssl_certificate /etc/letsencrypt/live/api.lead2pack.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.lead2pack.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;


    client_max_body_size 20M;

    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90s;
    }
}
